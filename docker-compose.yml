services:
  sftp-fetcher:
    build: .
    container_name: sftp-fetcher
    restart: unless-stopped

    # Use the same UID and GID as the Radarr container.
    # Radarr must be able to move and delete the files that this service writes.
    #
    # As an alternative, run this container as root (remove this line) and set
    # PUID and PGID below. The service then chowns each finished file to that
    # user, which also fixes a Radarr import permission error.
    user: "1000:1000"

    environment:
      # --- Where the file data comes from ---
      # TRANSFER_MODE: sftp | p2f
      #   sftp  the seedbox over SFTP (the default). Simple, but slow.
      #   p2f   a peer-to-file server, over its authenticated HTTP webseed.
      #         Resumable, encrypted, and much faster on a lossy link.
      TRANSFER_MODE: "sftp"

      # --- The SFTP server on the seedbox (TRANSFER_MODE=sftp) ---
      SFTP_HOST: "10.9.0.11"
      SFTP_PORT: "22"
      SFTP_USER: "torrent"
      SFTP_PASSWORD_FILE: "/run/secrets/sftp_password"
      REMOTE_DIR: "/uploads"

      # --- The peer-to-file server (TRANSFER_MODE=p2f) ---
      # P2F_URL: "http://10.9.0.11:8000"
      # A p2f_... API token. Make one on the server:
      #   node src/server/cli.ts add-token <user> <name>
      # Prefer the file form (a Docker secret) over the plain variable.
      # P2F_TOKEN_FILE: "/run/secrets/p2f_token"
      # P2F_TOKEN: "p2f_xxxxxxxxxxxxxxxxxxxx"
      # A prefix inside the server's shared root, if the tree is not at the
      # root. Empty means the shared root itself.
      # P2F_REMOTE_DIR: ""
      # Check each finished file against the server's plaintext SHA-256.
      # P2F_VERIFY: "true"

      # --- The qBittorrent Web API on the seedbox ---
      QBIT_URL: "http://10.9.0.11:8080"
      # QBIT_AUTH: apikey | password | none
      #   apikey    the qBittorrent API key (needs version 5.2.0 or later).
      #             Make one here: Options > Web UI > API keys > Generate.
      #   password  the user and the password (older versions).
      #   none      qBittorrent whitelists this IP. No credentials.
      QBIT_AUTH: "apikey"
      QBIT_API_KEY: "qbt_xxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      # For the "password" mode only:
      # QBIT_USER: "admin"
      # QBIT_PASS: "adminadmin"

      # --- The three paths. They all show the same data. ---
      # 1. The prefix that qBittorrent reports in "content_path".
      QBIT_ROOT: "/downloads"
      # 2. The folder in THIS container.
      LOCAL_ROOT: "/downloads"
      # (3. The folder in the RADARR container is the "Local Path" of the
      #     Radarr remote path mapping. See the notes.)

      POLL_INTERVAL: "60"
      MAX_WAIT_HOURS: "48"
      COPY_TRIES: "3"
      COPY_WAIT: "60"

      # --- File ownership (fixes a Radarr import permission error) ---
      # Set these to the UID and the GID that Radarr runs as. Each finished
      # file is then chowned to them, so Radarr can import it. This needs the
      # container to run as root (remove the "user:" line above). Leave them
      # out to keep the owner as it is.
      # PUID: "1000"
      # PGID: "1000"

      # --- Clean up after an import ---
      # Delete the local copy when Radarr sends its "On Import" webhook. The
      # film is in the library by then, so the staged copy only wastes disk.
      # The seedbox is never touched. Default true.
      # REMOVE_AFTER_IMPORT: "true"

    volumes:
      # The same host folder that Radarr mounts as its download folder.
      # Host:      /mnt/MEDIA/downloads
      # Radarr:    /data/downloads   <- the "Local Path" in the mapping
      # This one:  /downloads
      - /mnt/MEDIA/downloads:/downloads
      - ./state:/state

    secrets:
      - sftp_password

    networks:
      - media

networks:
  media:
    external: true

secrets:
  sftp_password:
    file: ./sftp_password.txt
